# Heap sizing is deliberately conservative. This project has 7 GiB of RAM total with
# ~3.5 GiB already in use by the desktop, so a 4096m Gradle heap caused the daemon to be
# OOM-killed mid-`assembleRelease` (R8 is the peak consumer). 3072m for Gradle plus a
# bounded Kotlin compile daemon keeps the total under the cgroup limit while still
# comfortably above the old 2048m, which was tight for AGP 9 + Compose + ktlint + lint
# in a single invocation. If you move to a bigger machine, raise these together.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
# Parallel + build cache are safe and materially speed up clean builds of
# AGP 9 + Compose + ktlint + lint in a single invocation.
org.gradle.parallel=true
org.gradle.caching=true
# R8 runs in the Gradle daemon process; forking it into its own JVM raises the peak
# and is not worth it at this heap size.
org.gradle.workers.max=4
# Configuration cache: deliberately left OFF. It cannot be validated without
# actually running a build, and an incompatible plugin would break every
# invocation. Enable after verifying `./gradlew assembleDebug` and
# `./gradlew testDebugUnitTest` still work:
#   org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
