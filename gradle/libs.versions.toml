[versions]
agp = "9.4.0"
kotlin = "2.2.20"
ktlint = "12.1.0"
composeBom = "2026.04.01"
coreKtx = "1.19.0"
lifecycle = "2.9.4"
activityCompose = "1.12.4"
# Nav3 replaces navigation-compose outright. 1.1.7 is the version the
# migration guide's own samples pin.
nav3 = "1.1.7"
coroutines = "1.11.0"
# Preferences DataStore, used only by the theme engine
# (ThemePreferencesRepository). Everything else in this project persists through
# SharedPreferences — introducing a second store for one feature is deliberate,
# not an oversight: the theme selection is the one setting that must be readable
# synchronously-consistently *before* the first frame, and SharedPreferences
# writes are fire-and-forget `apply()` which loses the last selection on a
# process kill during a slider drag.
datastore = "1.1.7"
shizuku = "13.1.5"
documentfile = "1.0.1"
# androidx.security:security-crypto is the deprecated artifact family; Google
# steered new work to the platform KeyStore API, and adb/AdbKeyVault.kt now does
# exactly that (AndroidKeyStore AES-256-GCM) for all key writes.
#
# It is still here for ONE reason: the Tink StreamingAead blobs written by
# earlier releases must stay readable, because an unreadable key silently
# rotates the user's ADB identity and forces a re-accept of the RSA
# authorization dialog. It is referenced from exactly one place — the legacy
# branch of AdbCrypto.readKeyFile(). Delete it, along with the EncryptedFile
# import, the buildEncryptedFile helper, the masterKey field and this comment,
# once no supported release still writes that format.
securityCrypto = "1.1.0"
gson = "2.13.2"
# Coil 3. Resolves TODO(coil): 2.7.0 was a stale major against a 2026.x Compose BOM.
# Beyond the package rename (coil.* -> coil3.*), the win is that network fetching is a
# separate opt-in artifact, so coil-compose no longer drags okhttp + okio + an HTTP
# fetcher in for an app that only ever loads local content URIs. See
# util/LocalOnlyImage.kt, which existed to work around exactly that in 2.x.
coil = "3.3.0"
media3 = "1.7.1"
junit = "4.13.2"
mockito = "5.24.0"
# KSP drives androidx.appfunctions:appfunctions-compiler. 2.3.6 is the floor:
# earlier releases refuse to attach to AGP 9's built-in Kotlin, and the
# documented workaround (android.builtInKotlin=false plus kotlin-android) does
# not work here because KGP 2.2.20 predates the AGP 9 BaseExtension removal.
# From 2.3.0 the KSP version is no longer tied to the Kotlin compiler version.
ksp = "2.3.12"
# AppFunctions is a platform API (android.app.appfunctions, API 36+), so the
# compileSdk floor is what gates it, not minSdk. 1.0.0-alpha11 is the first
# release whose AppFunctionServiceEntryPoint annotation is stable enough to
# generate the service + assets XML at compile time (alpha10 introduced it).
appfunctions = "1.0.0-alpha11"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "nav3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "nav3" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Theme engine persistence only. See the `datastore` version comment above.
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-appfunctions = { group = "androidx.appfunctions", name = "appfunctions", version.ref = "appfunctions" }
androidx-appfunctions-compiler = { group = "androidx.appfunctions", name = "appfunctions-compiler", version.ref = "appfunctions" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Required for the type-safe navigation route keys (nav/Destinations.kt): the
# @Serializable annotation is only generated when this plugin is applied, and
# Navigation2's composable<T>/navigate<T) match routes by the key's serial
# name. Version pinned to `kotlin` rather than left unset because Gradle
# requires a version to resolve a plugin from the repositories block, and this
# matches the compose compiler plugin - the other Kotlin-compiler plugin
# already applying successfully against AGP 9's built-in Kotlin.
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
