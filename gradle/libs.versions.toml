[versions]
agp = "9.4.0"
kotlin = "2.2.20"
ktlint = "12.1.0"
composeBom = "2026.04.01"
coreKtx = "1.19.0"
lifecycle = "2.9.4"
activityCompose = "1.12.4"
navigationCompose = "2.9.8"
coroutines = "1.11.0"
shizuku = "13.1.5"
documentfile = "1.0.1"
# TODO(security-crypto): androidx.security:security-crypto is the deprecated
# artifact family; Google has steered new work to the platform KeyStore/Tink
# API. The ADB key storage (adb/AdbCrypto.kt) depends on it today. Planned
# migration: replace EncryptedFile with a plain Tink AEAD Config backed by an
# AndroidKeyStore AES-GCM key, then drop this dependency.
securityCrypto = "1.1.0"
gson = "2.13.2"
# TODO(coil): 2.7.0 is a stale major against a 2026.x Compose BOM. Coil 3 is the
# current line and is a breaking API change, so it is deliberately NOT upgraded
# in this change set — it requires edits in ui/ that are out of scope. Track it
# as its own task.
coil = "2.7.0"
media3 = "1.7.1"
junit = "4.13.2"
mockito = "5.11.0"
# KSP drives androidx.appfunctions:appfunctions-compiler. 2.3.6 is the floor:
# earlier releases refuse to attach to AGP 9's built-in Kotlin, and the
# documented workaround (android.builtInKotlin=false plus kotlin-android) does
# not work here because KGP 2.2.20 predates the AGP 9 BaseExtension removal.
# From 2.3.0 the KSP version is no longer tied to the Kotlin compiler version.
ksp = "2.3.12"
# AppFunctions is a platform API (android.app.appfunctions, API 36+), so the
# compileSdk floor is what gates it, not minSdk. 1.0.0-alpha11 is the first
# release whose AppFunctionServiceEntryPoint annotation is stable enough to
# generate the service + assets XML at compile time (alpha10 introduced it).
appfunctions = "1.0.0-alpha11"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-appfunctions = { group = "androidx.appfunctions", name = "appfunctions", version.ref = "appfunctions" }
androidx-appfunctions-compiler = { group = "androidx.appfunctions", name = "appfunctions-compiler", version.ref = "appfunctions" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Required for the type-safe navigation route keys (nav/Destinations.kt): the
# @Serializable annotation is only generated when this plugin is applied, and
# Navigation2's composable<T>/navigate<T) match routes by the key's serial
# name. Version pinned to `kotlin` rather than left unset because Gradle
# requires a version to resolve a plugin from the repositories block, and this
# matches the compose compiler plugin - the other Kotlin-compiler plugin
# already applying successfully against AGP 9's built-in Kotlin.
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
