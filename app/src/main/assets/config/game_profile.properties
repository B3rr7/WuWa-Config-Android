# NOTE: this is a java.util.Properties file, so backslashes are ESCAPES. A regex
# like \d or \. must be written \d / \. here; Properties.load turns a single
# backslash into the bare character, which silently destroys the pattern. The
# GameProfileTest parity check catches exactly that class of mistake.
# Host selection is by player-id prefix, not by a region name: ids starting "1"
# go to gachaHostIdPrefix1 (.com), everything else to gachaHostOther (.net).
# This mirrors the literal branch that existed before externalisation.
