name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # setup-gradle caches ~/.gradle itself, keyed on the build inputs. This
      # job used to also run actions/cache with `restore-keys: Linux-gradle-`,
      # which restores the newest cache from any earlier run. After a dependency
      # bump that hands Gradle a module-metadata cache claiming the new plugin
      # version does not exist: the first run after the Kotlin 2.4.20 bump died
      # in 23s with "Plugin [id: 'org.jetbrains.kotlin.plugin.compose',
      # version: '2.4.20'] was not found" while the identical CI job passed on
      # the same commit. One cache owner, not two.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results*.xml
            app/build/reports/lint-results.html

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug
